<!DOCTYPE html>
<html lang="es">
<head>
    <title>CXVallas 24 · Estadio de 24 Calles</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/shared/portal-nav.css">
    <style>
        @font-face { font-family: "ps2p"; src: url(ps2p.ttf); }
        @font-face { font-family: "cgpixel"; src: url(cgpixel.ttf); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: ps2p, monospace; -webkit-font-smoothing: none; }
        body {
            background: #0b1120;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: grid;
            place-items: center;
        }
        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            object-fit: contain;
        }
        #hud-top {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(250, 204, 21, 0.45);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 10px;
            color: #fde047;
        }
        #radar-bar {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: min(86vw, 680px);
            height: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            z-index: 20;
            display: none;
            overflow: visible;
        }
        #radar-bar.active { display: block; }
        .radar-dot {
            position: absolute;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: #94a3b8;
        }
        .radar-dot.me {
            width: 12px;
            height: 12px;
            background: #facc15;
            border: 2px solid #fff;
            z-index: 5;
        }
        #menu, #podium-panel {
            position: fixed;
            z-index: 30;
            background: rgba(15, 23, 42, 0.92);
            border: 3px solid #f59e0b;
            border-radius: 14px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
            padding: 24px 28px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: min(92vw, 480px);
            text-align: center;
        }
        .hidden { display: none !important; }
        .title {
            font-size: 20px;
            color: #fde047;
            text-shadow: 0 3px 0 #b45309;
        }
        .subtitle {
            font-size: 9px;
            color: #cbd5e1;
            line-height: 1.7;
        }
        .controls-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 9px;
            color: #93c5fd;
            line-height: 1.9;
        }
        .records-mini {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(250, 204, 21, 0.25);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 9px;
            text-align: left;
        }
        .records-mini h3 {
            font-size: 10px;
            color: #facc15;
            margin-bottom: 8px;
            text-align: center;
        }
        .rec-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .rec-row:last-child { border-bottom: none; }
        .button {
            padding: 13px 22px;
            border-radius: 8px;
            color: #0f172a;
            background: #facc15;
            border: none;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #b45309;
        }
        .button:hover { filter: brightness(1.08); }
        .button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b45309; }
        .button-sec {
            background: #334155;
            color: #f8fafc;
            box-shadow: 0 4px 0 #1e293b;
        }
        #label {
            position: fixed;
            z-index: 25;
            font-size: 32px;
            color: #fde047;
            text-shadow: 0 4px 0 #000;
            pointer-events: none;
            text-align: center;
        }
        #wait-box {
            position: fixed;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 10px;
            color: #e0f2fe;
        }
        #wait-box button {
            padding: 7px 12px;
            font-size: 9px;
            border-radius: 6px;
            border: none;
            background: #22c55e;
            color: #052e16;
            cursor: pointer;
        }
        .podium-list {
            width: 100%;
            max-height: 260px;
            overflow-y: auto;
            font-size: 9px;
            text-align: left;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 8px;
            padding: 8px 12px;
        }
        .podium-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .podium-row.me { color: #fde047; }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="canvas"></canvas>

        <div id="hud-top">
            <span id="hud-pos">CALLE --</span>
            <span>|</span>
            <span id="hud-time">0.00s</span>
            <span>|</span>
            <span id="hud-record">RÉC: --</span>
        </div>

        <div id="radar-bar"></div>

        <div id="wait-box" class="hidden">
            <span id="wait-text">Esperando atletas...</span>
            <button id="btn-start-now" type="button">¡EMPEZAR YA!</button>
        </div>

        <div id="label"></div>

        <div id="menu">
            <div class="title">CXVALLAS 24</div>
            <div class="subtitle">ESTADIO OLÍMPICO · 24 CALLES SIMULTÁNEAS</div>
            <div class="controls-box">
                <div>[D] PULSA RÁPIDO PARA CORRER</div>
                <div>[A] SALTAR LAS VALLAS</div>
                <div style="color:#fca5a5;">¡NO TE MUEVAS ANTES DE "GO!"</div>
            </div>
            <div class="records-mini" id="menu-records">
                <h3>🏆 RÉCORDS DEL SERVIDOR</h3>
                <div id="menu-records-list" style="color:#94a3b8;text-align:center;">Cargando...</div>
            </div>
            <button class="button" id="btn-run" type="button">¡CORRER EN 24 CALLES!</button>
        </div>

        <div id="podium-panel" class="hidden">
            <div class="title" id="podium-title">🏆 CLASIFICACIÓN</div>
            <div class="podium-list" id="podium-list"></div>
            <button class="button" id="btn-again" type="button">CORRER OTRA VEZ</button>
            <button class="button button-sec" id="btn-menu-back" type="button">MENÚ</button>
        </div>
    </div>

    <img id="sprites" src="atlas.png" style="display: none;" />

    <script src="/shared/player.js"></script>
    <script>
        if (window.F4Player) {
            window.F4Player.mountNavBar();
            window.F4Player.ensureName();
        }

        const MAX_LANES = 24;
        const label = document.getElementById('label');
        const waitBox = document.getElementById('wait-box');
        const waitText = document.getElementById('wait-text');
        const menuEl = document.getElementById('menu');
        const podiumPanel = document.getElementById('podium-panel');
        const podiumList = document.getElementById('podium-list');
        const radarBar = document.getElementById('radar-bar');
        const hudPos = document.getElementById('hud-pos');
        const hudTime = document.getElementById('hud-time');
        const hudRecord = document.getElementById('hud-record');

        const zoom = 3;
        const VW = 320;
        const VH = 210;
        const canvas = document.getElementById('canvas');
        canvas.width = VW * zoom;
        canvas.height = VH * zoom;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const sprites = document.getElementById('sprites');
        const atlas = {
            fall: [{x:210,y:113,w:14,h:12},{x:226,y:113,w:14,h:12},{x:124,y:73,w:14,h:12},{x:124,y:59,w:14,h:12},{x:124,y:45,w:14,h:12}],
            idle: [[{x:46,y:107,w:11,h:18}],[{x:46,y:87,w:11,h:18}],[{x:59,y:107,w:11,h:18}],[{x:46,y:67,w:11,h:18}]],
            hurdle: [{x:98,y:13,w:7,h:12}],
            run: [
                [{x:59,y:87,w:11,h:18},{x:72,y:107,w:11,h:18},{x:46,y:47,w:11,h:18},{x:59,y:67,w:11,h:18},{x:72,y:87,w:11,h:18},{x:85,y:107,w:11,h:18},{x:46,y:27,w:11,h:18},{x:59,y:47,w:11,h:18}],
                [{x:72,y:67,w:11,h:18},{x:85,y:87,w:11,h:18},{x:98,y:107,w:11,h:18},{x:46,y:7,w:11,h:18},{x:59,y:27,w:11,h:18},{x:72,y:47,w:11,h:18},{x:85,y:67,w:11,h:18},{x:98,y:87,w:11,h:18}],
                [{x:111,y:107,w:11,h:18},{x:59,y:7,w:11,h:18},{x:72,y:27,w:11,h:18},{x:85,y:47,w:11,h:18},{x:98,y:67,w:11,h:18},{x:111,y:87,w:11,h:18},{x:124,y:107,w:11,h:18},{x:72,y:7,w:11,h:18}],
                [{x:85,y:27,w:11,h:18},{x:98,y:47,w:11,h:18},{x:111,y:67,w:11,h:18},{x:124,y:87,w:11,h:18},{x:137,y:107,w:11,h:18},{x:85,y:7,w:11,h:18},{x:98,y:27,w:11,h:18},{x:111,y:47,w:11,h:18}],
            ],
            jump: [[{x:150,y:111,w:13,h:14}],[{x:165,y:111,w:13,h:14}],[{x:180,y:111,w:13,h:14}],[{x:195,y:111,w:13,h:14}]],
        };

        // 24-lane stadium geometry (y measured from bottom of virtual canvas)
        let camera = 0;
        const floor = 16;
        const startOffset = 75;
        const carrilOffset = { x: 2.4, y: 6.4 }; // 24 lanes span ~154px vertically inside 210px height!

        const jumpV = 2.61;
        const gravity = 0.25;
        const runV = 2.05;
        const runD = 0.15;

        class Animation {
            constructor(duracionFrame, repetir, spritesList) {
                this.duracionFrame = duracionFrame;
                this.repetir = repetir;
                this.sprites = spritesList;
            }
            getFrame(time) {
                let frameNum = Math.floor(time / this.duracionFrame);
                if (this.repetir) frameNum %= this.sprites.length;
                else if (frameNum >= this.sprites.length) frameNum = this.sprites.length - 1;
                return this.sprites[frameNum];
            }
        }

        class Atleta {
            constructor(data) {
                this.runD = runD;
                this.name = data.name;
                this.carril = data.carril;
                this.isBot = Boolean(data.isBot);
                this.disqualified = false;
                this.x = 0;
                this.y = 0;
                this.vx = 0;
                this.vy = 0;
                this.animations = [
                    new Animation(2, true, atlas.run[this.carril % 4]),
                    new Animation(1, false, atlas.jump[this.carril % 4]),
                    new Animation(1, false, atlas.idle[this.carril % 4])
                ];
                this.state = 2;
                this.stateTime = 0;
            }
            choca(valla) {
                return valla.enpie && Math.abs(this.x - valla.x) < 2 && this.y < valla.h;
            }
            frenar() {
                this.vx -= 3;
                this.runD = 6;
            }
            update(delta) {
                if (this.disqualified || raceFinished) return;
                this.stateTime += delta;
                if (isKeyJustPressed(KEYS.D)) this.vx = runV;
                if (this.vx >= 0) { this.x += this.vx; this.vx -= this.runD; }
                if (this.vx < 0) this.vx = 0;
                this.runD -= 1;
                if (this.runD < runD) this.runD = runD;
                if (isKeyJustPressed(KEYS.A) && this.y === 0) this.vy = jumpV;
                if (this.y >= 0) { this.y += this.vy; this.vy -= gravity; }
                if (this.y < 0) { this.y = 0; this.vy = 0; }
                if (this.vy > 0) this.state = 1;
                else if (this.vx > 0) this.state = 0;
                else this.state = 2;
            }
            render(isMe) {
                const drawX = startOffset + this.carril * carrilOffset.x + this.x - camera;
                const drawY = floor + this.y + this.carril * carrilOffset.y;
                if (this.disqualified) ctx.globalAlpha = 0.4;
                draw(this.animations[this.state].getFrame(this.stateTime), drawX, drawY);
                ctx.globalAlpha = 1;

                // Crisp name tag near athlete's left lane start or following runner
                const labelX = Math.max(26, drawX - 18);
                ctx.font = `${isMe ? 10 : 8}px 'cgpixel', monospace`;
                ctx.textAlign = 'right';
                ctx.fillStyle = isMe ? '#fde047' : this.isBot ? '#94a3b8' : '#e2e8f0';
                const tag = isMe ? '▶ ' + this.name.slice(0, 10) : this.name.slice(0, 9);
                ctx.fillText(tag, labelX * zoom, canvas.height - (floor + this.carril * carrilOffset.y + 4) * zoom);
            }
        }

        class Valla {
            constructor(x, carril) {
                this.caerAnim = new Animation(4, false, atlas.fall);
                this.enpieAnim = new Animation(4, false, atlas.hurdle);
                this.x = x;
                this.carril = carril;
                this.h = this.enpieAnim.getFrame(0).h;
                this.enpie = true;
                this.stateTime = 0;
            }
            render() {
                this.stateTime += 1;
                const sx = startOffset + this.x - camera + this.carril * carrilOffset.x;
                if (sx < -20 || sx > VW + 20) return;
                const sprite = this.enpie ? this.enpieAnim.getFrame(this.stateTime) : this.caerAnim.getFrame(this.stateTime);
                draw(sprite, sx, floor + this.carril * carrilOffset.y - 1);
            }
            tirar() {
                this.stateTime = 0;
                this.enpie = false;
            }
        }

        class Carril {
            constructor(atleta) {
                this.atleta = atleta;
                this.vallas = [];
                for (let i = 0; i < 10; i++) this.vallas.push(new Valla(i * 100 + 50, atleta.carril));
            }
            render(isMe) {
                for (const v of this.vallas) v.render();
                this.atleta.render(isMe);
            }
        }

        class Pista {
            constructor() {
                this.carriles = new Array(MAX_LANES).fill(null);
            }
            renderStadium() {
                // Sky & stadium stands at top
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const trackBottomY = canvas.height - floor * zoom;
                const trackTopY = canvas.height - (floor + MAX_LANES * carrilOffset.y + 4) * zoom;

                // Stands / crowd pixels at top
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, 0, canvas.width, trackTopY);
                for (let row = 0; row < 4; row++) {
                    ctx.fillStyle = row % 2 === 0 ? '#475569' : '#334155';
                    ctx.fillRect(0, row * 12, canvas.width, 6);
                }
                // Stadium advertising wall
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, trackTopY - 14, canvas.width, 14);
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(0, trackTopY - 14, canvas.width, 3);

                // Grass infield at bottom
                ctx.fillStyle = '#15803d';
                ctx.fillRect(0, trackBottomY, canvas.width, canvas.height - trackBottomY);
                ctx.fillStyle = '#166534';
                for (let gx = -((camera * zoom) % 48); gx < canvas.width; gx += 48) {
                    ctx.fillRect(gx, trackBottomY, 24, canvas.height - trackBottomY);
                }

                // 24 Athletics Track Lanes
                for (let lane = 0; lane < MAX_LANES; lane++) {
                    const yBottom = canvas.height - (floor + lane * carrilOffset.y) * zoom;
                    const yTop = canvas.height - (floor + (lane + 1) * carrilOffset.y) * zoom;
                    const isMyLane = player && player.carril === lane;

                    ctx.fillStyle = isMyLane ? '#c2410c' : (lane % 2 === 0 ? '#9a3412' : '#882d10');
                    ctx.fillRect(0, yTop, canvas.width, yBottom - yTop);

                    // Crisp lane divider line
                    ctx.fillStyle = isMyLane ? 'rgba(250, 204, 21, 0.7)' : 'rgba(255, 255, 255, 0.35)';
                    ctx.fillRect(0, yTop, canvas.width, 1);

                    // Lane number on left edge
                    ctx.font = "8px 'cgpixel', monospace";
                    ctx.textAlign = 'left';
                    ctx.fillStyle = isMyLane ? '#fde047' : 'rgba(255,255,255,0.45)';
                    ctx.fillText(String(lane + 1), 6, yBottom - 4);
                }

                // Start line & Finish line (slanted across all 24 lanes!)
                const drawSlantedLine = (worldX, color, checkered) => {
                    const x0 = (startOffset + worldX - camera) * zoom;
                    const y0 = trackBottomY;
                    const x1 = (startOffset + worldX + MAX_LANES * carrilOffset.x - camera) * zoom;
                    const y1 = trackTopY;
                    ctx.strokeStyle = color;
                    ctx.lineWidth = checkered ? 6 : 3;
                    if (checkered) ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.moveTo(x0, y0);
                    ctx.lineTo(x1, y1);
                    ctx.stroke();
                    ctx.setLineDash([]);
                };

                drawSlantedLine(4, '#ffffff', false);
                drawSlantedLine(1004, '#fde047', true);
            }
            render() {
                this.renderStadium();
                for (let i = MAX_LANES - 1; i >= 0; i--) {
                    if (this.carriles[i]) {
                        this.carriles[i].render(player && player.carril === i);
                    }
                }
            }
            addAtleta(atleta) {
                this.carriles[atleta.carril] = new Carril(atleta);
            }
            removeAtleta(carril) {
                this.carriles[carril] = null;
            }
            updateAtleta(carril, a) {
                if (!this.carriles[carril]) return;
                this.carriles[carril].atleta.x = a.x;
                this.carriles[carril].atleta.y = a.y;
                this.carriles[carril].atleta.state = a.state;
                this.carriles[carril].atleta.stateTime = a.stateTime;
            }
            disqualify(carril) {
                if (this.carriles[carril]) this.carriles[carril].atleta.disqualified = true;
            }
            reset() {
                this.carriles = new Array(MAX_LANES).fill(null);
            }
        }

        function draw(sprite, x, y) {
            ctx.drawImage(
                sprites,
                sprite.x, sprite.y, sprite.w, sprite.h,
                x * zoom, canvas.height - (y + sprite.h) * zoom,
                sprite.w * zoom, sprite.h * zoom
            );
        }

        let player = null;
        let pista = new Pista();
        let joined = false;
        let raceStarted = false;
        let raceFinished = false;
        let raceStartMs = 0;
        let lastNetSend = 0;
        let loopRunning = false;

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsPath = location.pathname.startsWith('/games/cxvallas') ? '/ws/cxvallas' : '';
        let connection = null;
        let pendingMessages = [];

        function connectWS() {
            connection = new WebSocket(`${proto}//${location.host}${wsPath}`);
            connection.onopen = () => {
                while (pendingMessages.length > 0 && connection.readyState === WebSocket.OPEN) {
                    connection.send(pendingMessages.shift());
                }
            };
            connection.onmessage = (ev) => {
                try { onMessage(JSON.parse(ev.data)); } catch {}
            };
            connection.onclose = () => {
                setTimeout(connectWS, 2000);
            };
        }
        connectWS();

        function enviar(j) {
            const payload = JSON.stringify(j);
            if (connection && connection.readyState === WebSocket.OPEN) {
                connection.send(payload);
            } else {
                pendingMessages.push(payload);
            }
        }

        function updateRecordsDisplay(recData) {
            if (!recData) return;
            if (recData.record && recData.record.time) {
                hudRecord.textContent = `RÉC: ${recData.record.name.slice(0, 8)} ${recData.record.time.toFixed(2)}s`;
            }
            const listEl = document.getElementById('menu-records-list');
            const ranking = recData.ranking || [];
            if (!ranking.length) {
                listEl.innerHTML = '<div style="text-align:center;color:#94a3b8;">Aún no hay récords. ¡Sé el primero!</div>';
                return;
            }
            listEl.innerHTML = ranking.slice(0, 5).map((r, i) => `
                <div class="rec-row">
                    <span>#${i + 1} ${r.name}</span>
                    <span style="color:#fde047;">${r.bestTime != null ? r.bestTime.toFixed(2) + 's' : '--'}</span>
                </div>
            `).join('');
        }

        function showBanner(text, duration = 900) {
            label.textContent = text;
            label.animate([
                { transform: 'scale(0.6)', opacity: 1 },
                { transform: 'scale(1.15)', opacity: 1, offset: 0.7 },
                { transform: 'scale(1)', opacity: duration > 0 ? 0 : 1 }
            ], { duration: duration || 500, fill: 'forwards' });
        }

        function updateRadarAndHud() {
            if (!player) return;
            const active = pista.carriles.filter(Boolean).map(c => c.atleta);
            active.sort((a, b) => b.x - a.x);
            const myRank = active.findIndex(a => a.carril === player.carril) + 1;
            hudPos.textContent = `${myRank || '-'}º / ${active.length} (C.${player.carril + 1})`;
            if (raceStarted && !raceFinished) {
                hudTime.textContent = ((performance.now() - raceStartMs) / 1000).toFixed(2) + 's';
            }

            radarBar.innerHTML = '';
            for (const a of active) {
                const dot = document.createElement('div');
                dot.className = 'radar-dot' + (a.carril === player.carril ? ' me' : '');
                dot.style.left = Math.max(2, Math.min(98, (a.x / 1000) * 100)) + '%';
                radarBar.appendChild(dot);
            }
        }

        function joinRace() {
            const pName = window.F4Player ? window.F4Player.getName() : 'Atleta';
            pista.reset();
            player = null;
            joined = true;
            raceStarted = false;
            raceFinished = false;
            camera = 0;
            label.textContent = '';
            hudTime.textContent = '0.00s';
            menuEl.classList.add('hidden');
            podiumPanel.classList.add('hidden');
            radarBar.classList.add('active');
            enviar({ action: 'join', data: { name: pName } });
            if (!loopRunning) {
                loopRunning = true;
                lastTFrame = performance.now();
                requestAnimationFrame(mainLoop);
            }
        }

        function onMessage(m) {
            if (m.action === 'records') {
                updateRecordsDisplay(m.records);
            } else if (m.action === 'join_ok') {
                updateRecordsDisplay(m.records);
                player = new Atleta(m.player);
                pista.addAtleta(player);
                for (const atleta of m.players) {
                    if (atleta.carril !== player.carril) pista.addAtleta(new Atleta(atleta));
                }
                waitBox.classList.remove('hidden');
                waitText.textContent = `Atletas: ${m.players.length}/24 · Empieza en ${m.waitLeft || 8}s`;
            } else if (!player) {
                return;
            } else if (m.action === 'new_player') {
                if (m.player.carril !== player.carril) pista.addAtleta(new Atleta(m.player));
                const count = pista.carriles.filter(Boolean).length;
                if (!raceStarted) waitText.textContent = `Atletas: ${count}/24`;
            } else if (m.action === 'remove_player') {
                pista.removeAtleta(m.carril);
            } else if (m.action === 'wait') {
                const count = pista.carriles.filter(Boolean).length;
                if (m.value > 0) {
                    waitBox.classList.remove('hidden');
                    waitText.textContent = `Atletas: ${count}/24 · Salida en ${m.value}s`;
                } else {
                    waitBox.classList.add('hidden');
                }
            } else if (m.action === 'countdown') {
                waitBox.classList.add('hidden');
                if (m.value === 0) {
                    raceStarted = true;
                    raceStartMs = performance.now();
                    if (!player.disqualified) showBanner('¡GO!', 900);
                } else if (!player.disqualified) {
                    showBanner(String(m.value), 900);
                }
            } else if (m.action === 'update') {
                if (m.carril !== player.carril) pista.updateAtleta(m.carril, m.data);
            } else if (m.action === 'disqualify') {
                if (m.carril === player.carril) {
                    player.disqualified = true;
                    showBanner('SALIDA EN FALSO :(', 0);
                }
                pista.disqualify(m.carril);
            } else if (m.action === 'fall') {
                if (pista.carriles[m.carril]?.vallas[m.i]) {
                    pista.carriles[m.carril].vallas[m.i].tirar();
                }
            } else if (m.action === 'finish') {
                raceFinished = true;
                waitBox.classList.add('hidden');
                updateRecordsDisplay(m.records);
                showPodium(m.podium || []);
            }
        }

        function showPodium(podium) {
            podiumList.innerHTML = '';
            if (podium.length === 0) {
                podiumList.innerHTML = '<div style="text-align:center;padding:14px;">Carrera anulada</div>';
            } else {
                podium.forEach((p, idx) => {
                    const row = document.createElement('div');
                    row.className = 'podium-row' + (player && p.carril === player.carril ? ' me' : '');
                    const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
                    const status = p.disqualified ? 'DESCAL.' : p.finished && p.time ? `${p.time.toFixed(2)}s` : 'DNF';
                    row.innerHTML = `<span>${medal} ${p.name}</span><span>${status}</span>`;
                    podiumList.appendChild(row);
                });
            }
            podiumPanel.classList.remove('hidden');
        }

        function update(delta) {
            if (!player) return;
            camera = Math.max(0, player.x - 10);
            player.update(delta);

            if (pista.carriles[player.carril]) {
                for (const [i, valla] of pista.carriles[player.carril].vallas.entries()) {
                    if (player.choca(valla)) {
                        valla.tirar();
                        player.frenar();
                        enviar({ action: 'fall', data: { i, carril: player.carril } });
                    }
                }
            }

            const now = performance.now();
            if (now - lastNetSend >= 40) {
                lastNetSend = now;
                enviar({
                    action: 'update',
                    data: { x: player.x, y: player.y, state: player.state, stateTime: player.stateTime }
                });
            }
            updateRadarAndHud();
        }

        let lastTFrame = performance.now();
        function mainLoop(tFrame) {
            requestAnimationFrame(mainLoop);
            const delta = Math.min(50, tFrame - lastTFrame);
            update(delta);
            pista.render();
            lastTFrame = tFrame;
        }

        const KEYS = { A: { code: 65, down: false, up: true }, D: { code: 68, down: false, up: true } };
        function isKeyJustPressed(key) {
            if (key.down) { key.down = false; return true; }
            return false;
        }
        document.addEventListener('keydown', (ev) => {
            for (const key of Object.values(KEYS)) {
                if (ev.keyCode === key.code) {
                    if (key.up) { key.up = false; key.down = true; }
                    else key.down = false;
                }
            }
        });
        document.addEventListener('keyup', (ev) => {
            for (const key of Object.values(KEYS)) {
                if (ev.keyCode === key.code) { key.down = false; key.up = true; }
            }
        });

        document.getElementById('btn-run').addEventListener('click', joinRace);
        document.getElementById('btn-again').addEventListener('click', joinRace);
        document.getElementById('btn-menu-back').addEventListener('click', () => {
            enviar({ action: 'leave' });
            podiumPanel.classList.add('hidden');
            radarBar.classList.remove('active');
            menuEl.classList.remove('hidden');
        });
        document.getElementById('btn-start-now').addEventListener('click', () => {
            enviar({ action: 'start_now' });
        });

        // Initial background render
        sprites.onload = () => pista.render();
    </script>
</body>
</html>
